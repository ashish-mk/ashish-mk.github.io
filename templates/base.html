<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page_title}}</title>
  <meta name="description" content="{{meta_description}}">
  <link rel="icon" type="image/svg+xml" href="{{base_path}}static/favicon.svg">
  <link rel="stylesheet" href="{{base_path}}static/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="{{name}}'s Blog" href="{{base_path}}rss.xml">
</head>
<body>
  <div class="site-wrap">
    <header class="site-header">
      <a href="{{base_path}}index.html" class="brand">
        <span class="brand-dot"></span>
        {{name}}
      </a>
      <nav class="site-nav">
        <a href="{{base_path}}index.html" class="{{nav_home_class}}">Home</a>
        <a href="{{base_path}}blog/index.html" class="{{nav_blog_class}}">Blog</a>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">🌙 Dark</button>
      </nav>
    </header>

    <main>
      {{content}}
    </main>

    <footer class="site-footer">
      <div>© {{year}} {{name}}. All rights reserved.</div>
      <div>
        <a href="{{linkedin_url}}" target="_blank" rel="noopener">LinkedIn</a> ·
        <a href="{{github_url}}" target="_blank" rel="noopener">GitHub</a> ·
        <a href="{{base_path}}rss.xml">RSS</a>
      </div>
    </footer>
  </div>
  <script src="{{base_path}}static/js/main.js"></script>
</body>
</html>
