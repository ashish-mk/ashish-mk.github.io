<article>
  <a href="{{base_path}}blog/index.html" class="back-link">← Back to all posts</a>

  <header class="post-header">
    <h1>{{post_title}}</h1>
    <div class="post-meta">
      <time datetime="{{post_date}}">{{post_formatted_date}}</time>
      <span>·</span>
      <span>{{post_reading_time}}</span>
    </div>
    <div class="tags">
      {{post_tags_html}}
    </div>
  </header>

  <div class="post-body">
    {{post_body_html}}
  </div>

  <hr style="margin: 40px 0 20px;">
  <div style="font-size: 0.92rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
    <span>Written by <strong>{{name}}</strong></span>
    <a href="{{linkedin_url}}" target="_blank" rel="noopener" style="color: var(--accent); text-decoration: none;">Connect on LinkedIn →</a>
  </div>
</article>
